    let currentIdx = 0;

    function renderSlide(idx) {
      if (idx < 0) idx = 0;
      if (idx >= SLIDES.length) idx = SLIDES.length - 1;
      currentIdx = idx;

      const s = SLIDES[idx];
      const area = document.getElementById('slideArea');
      area.innerHTML = `
        <div class="slide-header">
          <div>
            <div class="slide-cat-badge">${s.cat}</div>
            <h1 class="slide-title">${s.title}</h1>
          </div>
          <img src="assets/images/logo.png" alt="Logo" style="height:36px; background:#fff; padding:2px 8px; border-radius:6px;">
        </div>
        ${s.html}
        <div class="slide-footer-meta">
          <span>ABHIVANTA Energy Intelligence &bull; Confidential Corporate Deck</span>
          <span>Slide ${idx + 1} of ${SLIDES.length}</span>
        </div>
      `;

      // Update controllers
      document.getElementById('curSlideNum').innerText = idx + 1;
      document.getElementById('totSlideNum').innerText = SLIDES.length;
      document.getElementById('btnPrev').disabled = (idx === 0);
      document.getElementById('btnNext').disabled = (idx === SLIDES.length - 1);

      // Progress bar
      const pct = ((idx + 1) / SLIDES.length) * 100;
      document.getElementById('progressFill').style.width = pct + '%';

      // Update thumbnails
      document.querySelectorAll('.deck-thumb-btn').forEach((b, i) => {
        if (i === idx) b.classList.add('active');
        else b.classList.remove('active');
      });

      if (window.lucide) lucide.createIcons();
    }

    function prevSlide() {
      if (currentIdx > 0) renderSlide(currentIdx - 1);
    }

    function nextSlide() {
      if (currentIdx < SLIDES.length - 1) renderSlide(currentIdx + 1);
    }

    function toggleFullscreen() {
      const el = document.getElementById('slideViewport');
      if (!document.fullscreenElement) {
        el.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'Space') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevSlide();
      } else if (e.key.toLowerCase() === 'f') {
        toggleFullscreen();
      }
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      // Build Thumb Tray
      const tray = document.getElementById('thumbTray');
      SLIDES.forEach((_, i) => {
        const btn = document.createElement('button');
        btn.className = `deck-thumb-btn ${i === 0 ? 'active' : ''}`;
        btn.innerText = i + 1;
        btn.onclick = () => renderSlide(i);
        tray.appendChild(btn);
      });

      renderSlide(0);
      if (window.lucide) lucide.createIcons();
    });
  </script>
